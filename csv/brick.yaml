# Conversion in both directions, because a table is what arrives from outside and items are what
# a workflow is made of. One row is one item, which is the unit a fan-out divides.
apiVersion: agentiik.dev/v1
kind: Brick

metadata:
  name: csv
  version: 0.8.0
  summary: Converts a table into one item per row, and a batch of items into a table.

spec:
  inputs:
    in:
      schema:
        type: object
        description: >-
          to_items: an item attaching the table as a file, whatever its data. to_table: any item, which becomes one row with a column per member of its data.
        examples:
          - {}
          - { ref: a1, amount: 1200, currency: EUR }

  outputs:
    out:
      schema:
        type: object
        description: >-
          to_items: one item per row, with a member per column, every value a string as the table wrote it. to_table: one item attaching the table, whose data says how many rows and bytes it holds and which columns, in the order written.
        examples:
          - { ref: a1, amount: "1200", currency: EUR }
          - { rows: 3, bytes: 78, columns: [charged, currency, ref, settled] }

  params:
    direction:
      type: string
      enum: [to_items, to_table]
      required: true
      description: >-
        to_items reads the table each item attaches and publishes one item per row. to_table
        reads the whole batch and publishes one item attaching the table as an artifact, however
        small, so that a step below reads it one way whatever its size.
      examples: [to_items, to_table]
    file:
      type: string
      description: >-
        to_items only. The name of the attached artifact holding the table. An item attaching
        exactly one file needs no name.
      examples: [orders.csv]
    table_name:
      type: string
      default: table.csv
      description: to_table only. What the table's artifact is called.
      examples: [charges.csv]
    header:
      type: boolean
      default: true
      description: >-
        Whether the first record names the columns. Reading without a header names them by
        position, c0 upwards; writing without one omits it.
      examples: [true, false]
    delimiter:
      type: string
      default: ","
      description: One character.
      examples: [",", ";", "\t"]
    inline_max_bytes:
      type: integer
      minimum: 0
      default: 262144
      description: >-
        The size above which a value of an item travels as an artifact rather than in the
        envelope, a cell of to_items among them, written to a JSON artifact of its own. The table
        of to_table is always an artifact. The default is the documented inline_max_bytes, and a
        step on an installation that tuned the setting passes its own.
      examples: [262144, 65536]

  runtime:
    network: none
    streaming: false
    user: "65532:65532"

  resources:
    cpu: "0.5"
    memory: 256Mi
    pids: 64
