# Validation that routes rather than fails. A batch of a thousand orders with three bad ones is
# not a failed step, and the workflow decides what the three are worth.
apiVersion: agentiik.dev/v1
kind: Brick

metadata:
  name: schema-validate
  version: 0.8.0
  summary: Holds every item to a JSON Schema and routes the ones that do not meet it to a port of their own.

spec:
  inputs:
    in:
      schema:
        type: object
        description: Any item. Its data is the payload held to the schema.
        examples:
          - { ref: a1, amount: 1200 }

  outputs:
    ok:
      schema:
        type: object
        description: The items the schema accepts, unchanged.
        examples:
          - { ref: a1, amount: 1200 }
    invalid:
      schema:
        type: object
        description: >-
          One item per item the schema refuses, under the same identity and with the same
          attachments: the payload as it arrived, and every departure from the schema found in it.
        required: [item, violations]
        properties:
          item:
            description: The payload as it arrived, unchanged.
          violations:
            type: array
            description: Every departure found, not only the first, so that one look fixes the item.
            items:
              type: object
              required: [path, keyword, message]
              properties:
                path: { type: string, description: "JSON Pointer into the payload, empty for the payload itself." }
                keyword: { type: string, description: "Where in the schema the departure was found." }
                message: { type: string, description: "What the departure is, in words." }
        examples:
          - item: { ref: b2, amount: -5 }
            violations:
              - { path: /amount, keyword: /properties/amount/minimum, message: "minimum: got -5, want 1" }

  params:
    schema:
      type: object
      description: >-
        The JSON Schema 2020-12 document to hold every item to, written inline. Exactly one of
        schema and schema_path.
      examples:
        - { type: object, required: [ref, amount], properties: { ref: { type: string }, amount: { type: integer, minimum: 1 } } }
    schema_path:
      type: string
      description: >-
        The schema as a file of the workflow repository, relative to /agk/repo and inside it.
        Exactly one of schema and schema_path.
      examples:
        - schemas/order.json

  runtime:
    network: none
    streaming: false
    user: "65532:65532"

  resources:
    cpu: "0.5"
    memory: 128Mi
    pids: 64
